# HOI PROJECT CONFIG - PoliTo Advanced ML 2026-27

# === SEED & DEVICE ===
seed: 42
device: "cuda"

# === PATHS ===
# Every team member works on their OWN Google Drive: everything that must survive
# a Colab session lives in MyDrive/HOI_Project (created by main.ipynb).
# The dataset is extracted on the Colab local disk (fast I/O), never read
# file-by-file from Drive.
project_root: "."
drive_root: "/content/drive/MyDrive/HOI_Project"
drive_dataset_dir: "${drive_root}/dataset"    # DexYCB .tar.gz archives (persistent copy)
mano_dir: "${drive_root}/mano"                # MANO_RIGHT.pkl / MANO_LEFT.pkl (licence: never on GitHub)
checkpoint_dir: "${drive_root}/checkpoints"   # one sub-folder per model (train.*.checkpoint_subdir)
log_dir: "${drive_root}/logs"
output_dir: "${drive_root}/outputs"           # figures and tables for the report
data_root: "/content/dexycb"                  # local extraction folder on the Colab VM

# === DATASET: DexYCB, official files (https://dex-ycb.github.io/) ===
# Downloaded ONCE into drive_dataset_dir by scripts/download_dataset.py,
# then copied and extracted into data_root at every Colab session.
dexycb:
  subject: "20200709-subject-01"    # 1 subject out of 10 = the 10% subset of the project
  files:
    subject:
      name: "20200709-subject-01.tar.gz"   # ~12.4 GB: images, depth, labels, meta.yml
      drive_id: "1Ehh92wDE3CWAiKG7E9E73HjN2Xk2XfEk"
    calibration:
      name: "calibration.tar.gz"           # ~16 KB: camera intrinsics/extrinsics, MANO betas
      drive_id: "1UAwVKT4Rgb1fLcFoa1o71_-0NtSvvLAQ"
    models:
      name: "models.tar.gz"                # ~1.4 GB: YCB object meshes (ADD, PD, rendering)
      drive_id: "1cAzlQBpcTatI5ykYQ8ziQiHLUG_a_UpM"

# === EXPERIMENT TRACKING: Weights & Biases ===
wandb:
  project: "hoi-dexycb"
  entity: null        # W&B team name (null = your personal account)
  mode: "online"      # "offline" to log locally, "disabled" to turn it off

# === DATA ===
data:
  batch_size: 32
  num_workers: 0
  image_size: 256
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  augment:
    color_jitter: true
    gaussian_blur: true
    jitter_brightness: 0.2
    jitter_contrast: 0.2
    jitter_saturation: 0.2
    jitter_hue: 0.1
    blur_kernel_size: 3
    blur_sigma: [0.1, 2.0]

# === MODEL: HaMeR ===
# NOTE: to be replaced by the official pretrained HaMeR (github.com/geopavlakos/hamer)
hamer:
  backbone: "vit_base_patch16_224"
  mano_params: 48
  num_joints: 21
  num_vertices: 778
  pretrained_path: "${checkpoint_dir}/hamer_pretrained/hamer.ckpt"

# === MODEL: HOI ===
hoi:
  freeze_backbone: true
  feature_dim: 768
  hand_mano_head_hidden: [512, 256]
  hand_joints_head_hidden: [512, 256]
  obj_embed_dim: 32
  obj_pose_head_hidden: [512, 256]
  num_object_classes: 20

# === TRAINING ===
# Each model saves its checkpoints in ${checkpoint_dir}/<checkpoint_subdir>,
# so resuming one model never picks up the checkpoints of another.
train:
  hamer:
    checkpoint_subdir: "hamer_finetuned"
    epochs: 50
    lr: 1.0e-4
    weight_decay: 1.0e-5
    scheduler: "cosine"
    warmup_epochs: 5
    mixed_precision: true
    grad_accum_steps: 1
    save_every: 5
    clip_grad_norm: 1.0

  hoi:
    checkpoint_subdir: "hoi_model"
    epochs: 100
    lr: 5.0e-5
    weight_decay: 1.0e-5
    scheduler: "cosine"
    warmup_epochs: 10
    mixed_precision: true
    grad_accum_steps: 2
    save_every: 5
    clip_grad_norm: 1.0
    loss_weights:
      hand_trans: 1.0
      hand_mano: 1.0
      hand_joints: 1.0
      obj_trans: 1.0
      obj_rot: 1.0
      rel_trans: 0.5
