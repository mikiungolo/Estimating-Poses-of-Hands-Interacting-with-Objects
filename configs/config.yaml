# HOI PROJECT CONFIG - PoliTo Advanced ML 2026-27

# === SEED & DEVICE ===
seed: 42
device: "cuda"

# === PATHS (resolved via env vars) ===
project_root: "${oc.env:PROJECT_ROOT, .}"
data_root: "${oc.env:DATA_ROOT, ./dataset/raw}"
checkpoint_dir: "${oc.env:CHECKPOINT_DIR, ./checkpoints}"
log_dir: "${oc.env:LOG_DIR, ./logs}"

# === DATASET ===
dexycb_drive_file_id: "${oc.env:DEXYCB_DRIVE_FILE_ID, 1Ehh92wDE3CWAiKG7E9E73HjN2Xk2XfEk}"

# === DATA ===
data:
  batch_size: 32
  num_workers: 0
  image_size: 256
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  augment:
    color_jitter: true
    gaussian_blur: true
    jitter_brightness: 0.2
    jitter_contrast: 0.2
    jitter_saturation: 0.2
    jitter_hue: 0.1
    blur_kernel_size: 3
    blur_sigma: [0.1, 2.0]

# === MODEL: HaMeR ===
hamer:
  backbone: "vit_base_patch16_224"
  mano_params: 48
  num_joints: 21
  num_vertices: 778
  pretrained_path: "${checkpoint_dir}/hamer_pretrained/hamer.ckpt"

# === MODEL: HOI ===
hoi:
  freeze_backbone: true
  feature_dim: 768
  hand_mano_head_hidden: [512, 256]
  hand_joints_head_hidden: [512, 256]
  obj_embed_dim: 32
  obj_pose_head_hidden: [512, 256]
  num_object_classes: 20

# === TRAINING ===
train:
  hamer:
    epochs: 50
    lr: 1.0e-4
    weight_decay: 1.0e-5
    scheduler: "cosine"
    warmup_epochs: 5
    mixed_precision: true
    grad_accum_steps: 1
    save_every: 5
    clip_grad_norm: 1.0
  
  hoi:
    epochs: 100
    lr: 5.0e-5
    weight_decay: 1.0e-5
    scheduler: "cosine"
    warmup_epochs: 10
    mixed_precision: true
    grad_accum_steps: 2
    save_every: 5
    clip_grad_norm: 1.0
    loss_weights:
      hand_trans: 1.0
      hand_mano: 1.0
      hand_joints: 1.0
      obj_trans: 1.0
      obj_rot: 1.0
      rel_trans: 0.5